<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscador Complejo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h3>🔍 Buscador de Motos</h3>
            <form method="POST" class="row g-3">
                <div class="col-md-9">
                    <input type="text" name="criterio" class="form-control" placeholder="Escribe marca o modelo (ej. Honda o CBR)..." required>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-info w-100">Filtrar</button>
                </div>
            </form>
            <hr>
            <table class="table table-striped mt-3">
                <thead><tr><th>Modelo</th><th>Marca</th><th>Precio</th></tr></thead>
                <tbody>
                    {% for moto in motos %}
                    <tr><td>{{ moto.modelo }}</td><td>{{ moto.marca }}</td><td>{{ moto.precio }}€</td></tr>
                    {% endfor %}
                </tbody>
            </table>
            <a href="/" class="btn btn-secondary">Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
