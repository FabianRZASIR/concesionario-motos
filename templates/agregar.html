<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Añadir Moto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white"><h3>Registrar Nueva Moto</h3></div>
                    <div class="card-body">
                        <form method="POST">
                            <label class="form-label">Modelo:</label>
                            <input type="text" name="modelo" class="form-control mb-3" required>
                            
                            <label class="form-label">Marca:</label>
                            <select name="id_marca" class="form-select mb-3">
                                {% for marca in marcas %}
                                <option value="{{ marca.id_marca }}">{{ marca.nombre }}</option>
                                {% endfor %}
                            </select>
                            
                            <div class="row">
                                <div class="col"><label class="form-label">Precio (€):</label><input type="number" name="precio" class="form-control mb-3" step="0.01"></div>
                                <div class="col"><label class="form-label">Stock:</label><input type="number" name="stock" class="form-control mb-3"></div>
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100">Guardar en Base de Datos</button>
                            <a href="/" class="btn btn-link w-100 mt-2 text-decoration-none">Volver</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
