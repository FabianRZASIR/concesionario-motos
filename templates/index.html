<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Concesionario - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">🏍️ MotoSystem Pro</span>
            <div>
                <a href="/" class="btn btn-outline-light btn-sm">Inicio</a>
                <a href="/buscar" class="btn btn-outline-info btn-sm">Buscador</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Inventario Actual</h2>
            <a href="/agregar" class="btn btn-primary">+ Añadir Moto</a>
        </div>
        <div class="card shadow">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr><th>Modelo</th><th>Marca</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
                    </thead>
                    <tbody>
                        {% for moto in motos %}
                        <tr>
                            <td>{{ moto.modelo }}</td>
                            <td>{{ moto.marca }}</td>
                            <td>{{ moto.precio }}€</td>
                            <td>{{ moto.stock }} uds.</td>
                            <td><a href="/eliminar/{{ moto.id_moto }}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar esta moto?')">Borrar</a></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
